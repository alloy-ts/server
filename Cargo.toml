[package]
name = "alloy-service-native"
version = "0.1.0"
edition = "2024"
autobins = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.14.2", features = ["tokio_rt", "napi4", "napi5", "compat-mode", "serde-json"] }
napi-derive = "3.6.12"
rocket = "0.5.1"
serde_json = "1"
tower-service = "0.3.3"

[features]
default = ["tls", "secrets"]
# `config.rs` gates `TlsConfig`/`MutualTls`/`tlsEnabled` behind `feature = "tls"`
# and `secret_key` behind `feature = "secrets"`. These names must match the
# `#[cfg(...)]` attributes in `src/config.rs`.
tls = ["rocket/tls", "rocket/mtls"]
secrets = ["rocket/secrets"]

[build-dependencies]
napi-build = "2"
