[package]
name = "alloy-server-native"
version = "0.1.0"
edition = "2021"
autobins = false

[lib]
crate-type = ["cdylib"]

[features]
default = ["tls", "mtls", "secrets"]
tls = ["rocket/tls"]
mtls = ["rocket/mtls", "tls"]
secrets = ["rocket/secrets"]

[dependencies]
napi = { version = "3.14.2", features = ["tokio_rt", "napi4", "compat-mode", "serde-json"] }
napi-derive = "3.6.12"
rocket = { version = "0.5.1", features = ["tls", "mtls", "secrets"] }
serde_json = "1"

[build-dependencies]
napi-build = "2"
